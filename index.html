 return r.result_source==='THE_RACING_API'&&r.verification_status==='PROVIDER_ACCEPTED'

(function(){

function confidenceTier(r){
 const p=r.competition_confidence_percent;
 return typeof p==='number'&&Number.isFinite(p)&&p>=0&&p<=100?(p>=80?'high':p>=70?'medium':'low'):'unrated';
}
function confidenceBox(){return '';}
function resultView(r){
 let url;try{url=new URL(r.result_source_url)}catch(_){return {label:'Pending',css:'pending'};}
 if(!window.jcmAcceptedResult(r))return {label:'Pending',css:'pending'};
 const labels={WIN:['Horse lost','win'],LOSS:['Horse won','loss'],NR:['NR','nr']};
 const value=labels[r.result_status];return value?{label:value[0],css:value[1]}:{label:'Pending',css:'pending'};
}
function paint(){
 if(date.value!==day)return;
 const settled=detailRows.filter(r=>['win','loss'].includes(resultView(r).css));
 const wins=settled.filter(r=>resultView(r).css==='win').length;
 const rate=state==='ready'&&detailRows.length===0?'No picks today':state==='ready'?(settled.length?Math.round(wins/settled.length*1000)/10+'% success · '+wins+'/'+settled.length+' settled':'No settled results'):state==='error'?'Results unavailable':'Loading results…';
 const tile=document.getElementById('jcm-daily-rate');if(tile)tile.textContent=(day===new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(new Date())?'Today':day)+' · '+rate;
 const heading='<div class="jcm-panel-heading"><h2>Daily picks</h2><span class="jcm-accuracy">'+safe(rate)+'</span></div>';
 const note='<p class="jcm-ft-note">Tap a horse for the original reasoning and race links.</p>';
 panel.innerHTML=heading+(state==='ready'&&detailRows.length===0?'':note)+(state==='loading'?'<p role="status">Loading today’s horses…</p>':state==='error'?'<p role="status">INSUFFICIENT VERIFIED DATA — today’s list could not be loaded.</p>':detailRows.length===0?'<p role="status">No picks today — Sunday 25 October 2026.</p>':detailRows.map((r,i)=>'<button type="button" class="jcm-row jcm-research-row jcm-rating-'+confidenceTier(r)+(day==='2026-10-13'&&r.tier==='watchlist'?' jcm-competition-watchlist':'')+'" data-research-index="'+i+'"><span><span class="jcm-time">'+safe(r.off_time_uk)+'</span><span class="jcm-ground">'+safe(r.course)+'</span></span><span class="jcm-horse">'+safe(r.horse)+'</span><span class="jcm-status '+resultView(r).css+'">'+safe(resultView(r).label)+'</span></button>').join(''));
}
window.jcmResearchResultView=resultView;
window.jcmShowResearchCard=(r,m=null)=>{
 const overlay=document.getElementById('jcm-detail-overlay');
 if(!r||!overlay)return;
 const day=r.race_date;
 const reason=r.selection_reason,hasReason=reason&&typeof reason.summary==='string'&&reason.summary.trim()&&['RECOVERED_PRIOR_ANALYSIS_NOT_REVERIFIED','ORIGINAL_SCREENSHOT_ANALYSIS','RACING_API_AND_USER_ASSESSMENT','RACING_API_PRO_AND_SPORTING_LIFE'].includes(reason.evidence_status);
 const roundup=hasReason?reason.summary:r.identified_challengers.length?'Chosen for review because '+r.identified_challengers.join(', ')+' were identified as competing threats.':'Selection reason not supplied.';
 const reasonContent='<p>'+safe(roundup)+'</p>'+(hasReason?'<p><strong>Counterargument</strong><br>'+safe(reason.counterargument||'Not supplied.')+'</p>'+(Array.isArray(reason.challengers)&&reason.challengers.length?'<p><strong>Main challengers</strong><br>'+safe(reason.challengers.join(', '))+'</p>':'')+'<small>'+safe(reason.evidence_status==='RACING_API_PRO_AND_SPORTING_LIFE'?'The Racing API Pro + Sporting Life pre-race assessment':reason.evidence_status==='RACING_API_AND_USER_ASSESSMENT'?'User-confirmed pre-race assessment':reason.evidence_status==='ORIGINAL_SCREENSHOT_ANALYSIS'?'Original pre-race assessment':'Recovered morning research · underlying source data not reverified.')+'</small>':'');
 const view=resultView(r),accepted=view.css!=='pending'&&m&&m.race_id===r.result_race_id&&m.horse_id===r.result_horse_id&&m.position===r.position&&((r.result_status==='LOSS'&&m.position==='1')||(r.result_status==='WIN'&&(Number(m.position)>1||(m.position==='PU'&&r.result_stage==='WEIGHEDIN'))))&&(!r.placing||r.placing===ordinal(m.position));
 const card=racecardLink(m,r),results=raceResultsLink(m,r);
 const finish=view.css==='pending'?'Pending':accepted?(m.position==='PU'?'Pulled up':'Finished '+ordinal(m.position)+(m.dead_heat_place?' (joint)':'')+' of '+m.field_size):String(r.placing??r.position??'Not supplied');
 const stat=(label,value)=>'<div class="jcm-result-stat"><small>'+safe(label)+'</small><strong>'+safe(value)+'</strong></div>';
 const tile=(title,content)=>'<section class="jcm-result-tile"><h3>'+safe(title)+'</h3>'+content+'</section>';
 const winner=stat('Winner',accepted?m.winner:'Not yet available')+stat('Winning margin',accepted?margin(m.winning_margin_lengths):'Not yet available')+(view.css==='loss'?'':stat('Selected horse beaten by',accepted?(m.position==='PU'?'Not applicable — pulled up':margin(m.selected_beaten_lengths)):'Not yet available'));
 const priceTile=Number.isFinite(r.lay_odds)&&r.lay_odds>1?tile('Recorded lay price',stat(r.lay_price_provenance?.source_type==='BETFAIR_EXCHANGE_API_DELAYED'?'Delayed API lay odds':'Screenshot lay odds',r.lay_odds)+stat('Liability for £10 lay stake','£'+(10*(r.lay_odds-1)).toFixed(2))+'<small>Source: '+safe(r.source||'Not supplied')+(r.lay_price_provenance?.source_type==='BETFAIR_EXCHANGE_API_DELAYED'?' · Delayed indicative price; exact quote time/delay unavailable. £500 paper trial assumes full stake; displayed liquidity insufficient, matching unverified and value unproven.':' · Screenshot price, not live odds')+'</small>'):'';
 const cardTile=tile('Racecard',card?'<a class="jcm-race-action" href="'+safe(card)+'" target="_blank" rel="noopener">View this racecard ↗</a>':'<p class="jcm-link-unavailable">Exact racecard link not verified.</p><a class="jcm-race-action" href="https://www.sportinglife.com/racing/racecards/'+safe(day)+'" target="_blank" rel="noopener">Browse racecards for this day ↗</a>');
 const resultsTile=tile('Race results',results?'<a class="jcm-race-action" href="'+safe(results)+'" target="_blank" rel="noopener">View this race result ↗</a>':'<p class="jcm-link-unavailable">Exact race result link not yet verified.</p><a class="jcm-race-action" href="https://www.sportinglife.com/racing/results/'+safe(day)+'" target="_blank" rel="noopener">Browse results for this day ↗</a>');
 const videoTile=tile('Race video','<a class="jcm-race-action" href="https://www.sportinglife.com/racing/results" target="_blank" rel="noopener">View race videos here</a><small>Sporting Life login may be required.</small>');
 overlay.querySelector('#jcm-detail-content').innerHTML='<article class="jcm-result-card"><div class="jcm-result-top"><span class="jcm-result-time">'+safe(r.off_time_uk)+'</span><div class="jcm-result-course"><strong>'+safe(r.course)+'</strong><small>'+safe(new Date(day+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'Europe/London'}))+' · UK time</small></div>'+confidenceBox(r,true)+'</div><div class="jcm-result-summary"><span class="jcm-result-outcome '+view.css+'">'+safe(view.label)+'</span><strong class="jcm-result-finish">'+safe(finish)+'</strong></div><div class="jcm-result-body">'+tile('Selected horse','<h2>'+safe(r.horse)+'</h2><p>'+safe(m?.race_name||'Race details not supplied')+'</p>')+tile('Race winner',winner)+tile('Reason for selection',reasonContent)+priceTile+cardTile+resultsTile+videoTile+'</div></article>';
 overlay.classList.add('open');overlay.querySelector('.jcm-close').focus();
};
panel.addEventListener('click',e=>{
 const button=e.target.closest('[data-research-index]');if(!button)return;
 const r=detailRows[Number(button.dataset.researchIndex)];if(r)window.jcmShowResearchCard(r,detailFor(r));
});
async function loadDay(){
 const selected=date.value,version=++loadVersion;
 if(!Object.prototype.hasOwnProperty.call(researchDays,selected))return;
 day=selected;detailRows=[];cardDetails=[];state='loading';paint();
 try{
  const response=await fetch('data/competition-research-'+selected+'.json',{cache:'no-store'});if(!response.ok)throw Error('unavailable');const d=await response.json();
  if(d.schema_version!==1||d.mode!=='research_only_not_official_picks'||d.date!==selected||!Array.isArray(d.high_competition)||!Array.isArray(d.competition_watchlist))throw Error('invalid research data');
  const rows=[...d.high_competition,...d.competition_watchlist].sort((a,b)=>a.off_time_uk.localeCompare(b.off_time_uk));
  if(rows.length!==researchDays[selected]||rows.some(r=>r.race_date!==selected||typeof r.horse!=='string'||typeof r.course!=='string'||!/^\d{2}:\d{2}$/.test(r.off_time_uk)||!Array.isArray(r.identified_challengers))||new Set(rows.map(r=>[r.off_time_uk,r.course,r.horse].join('|'))).size!==rows.length)throw Error('invalid rows');
  if(version!==loadVersion||date.value!==selected)return;
  detailRows=rows;state='ready';paint();
  try{const response=await fetch('data/result-card-details-'+selected+'.json',{cache:'no-store'});if(!response.ok)throw Error('Unavailable');const d=await response.json();if(version===loadVersion&&date.value===selected&&d.schema_version===1&&d.date===selected&&Array.isArray(d.details))cardDetails=d.details;}catch(_){}
 }catch(_){if(version===loadVersion&&date.value===selected){state='error';paint();}}
}
date.addEventListener('change',loadDay);window.addEventListener('pageshow',loadDay);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadDay();});setInterval(()=>{if(!document.hidden)loadDay();},30000);loadDay();
})();
