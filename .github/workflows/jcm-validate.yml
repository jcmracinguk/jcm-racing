name: JCM data integrity check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - 'scripts/validate_race_analysis.py'
      - '.github/workflows/jcm-validate.yml'
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - 'scripts/validate_race_analysis.py'
      - '.github/workflows/jcm-validate.yml'
  schedule:
    - cron: '17,47 7-20 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate locked selections and provider state
        run: python scripts/validate_data.py
      - name: Validate unified all-runner analyses
        run: python scripts/validate_race_analysis.py
      - name: Check simulation bankroll accounting
        run: node tests/bankroll.cjs
      - name: Check active racing run and isolated football results
        run: node tests/current-run.cjs
      - name: Check football accumulator settlement
        run: node tests/football-acca.cjs
