name: Publish app changes
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - jcm-logo.svg
      - football.html
      - football.webmanifest
      - manifest.webmanifest
      - scripts/jcm-shell.css
      - scripts/sport-switch.css
      - scripts/sport-switch.js
      - scripts/football-ui.js
      - scripts/football-acca.js
      - data/football-bet-builder*.json
      - data/football-results*.json
      - scripts/bet-builder.js
      - scripts/bet-builder.css
      - .github/workflows/publish-app.yml
permissions:
  contents: read
  pages: write
concurrency:
  group: publish-app
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
